<div class="layout-wrapper">

  <!-- Mobile Top Header Bar -->
  <header class="mobile-header">
    <button type="button" (click)="toggleSidebar()" class="btn-hamburger">
      <svg lucideMenu class="w-6 h-6 text-white"></svg>
    </button>
    <span class="mobile-brand">Saku-ku</span>
  </header>

  <!-- Backdrop Mobile
  @if (isSidebarOpen()) {
    <div class="mobile-backdrop" (click)="closeSidebar()"></div>
  } -->

  <!-- Backdrop Overlay (Khusus Mobile saat Sidebar Terbuka) -->
  @if (isSidebarOpen()) {
    <div class="mobile-backdrop" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar Wrapper (Responsif Drawer di Mobile, Statis di Desktop) -->
  <div class="sidebar-responsive-wrapper" [class.open]="isSidebarOpen()">
    <app-sidebar></app-sidebar>
  </div>

  <!-- Main Content + Navbar Kanan -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden">
  
    <!-- Top Navbar -->
    <app-navbar></app-navbar>

  <!-- Main Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
