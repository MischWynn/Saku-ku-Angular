<div class="layout-wrapper">

  <div class="bg-decor" aria-hidden="true"></div>

  <header class="mobile-header">
    <button type="button" (click)="toggleSidebar()" class="btn-hamburger">
      <svg lucideMenu class="w-6 h-6 text-white"></svg>
    </button>
    <span class="mobile-brand">Saku-ku</span>
  </header>

  @if (isSidebarOpen()) {
    <div class="mobile-backdrop" (click)="closeSidebar()"></div>
  }

  <div class="sidebar-responsive-wrapper" [class.open]="isSidebarOpen()">
    <app-sidebar></app-sidebar>
  </div>

  <div class="content-shell flex-1 flex flex-col h-screen overflow-hidden">

    <app-navbar></app-navbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
