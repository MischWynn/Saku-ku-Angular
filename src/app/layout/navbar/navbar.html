<header class="navbar-wrapper">
  
  <!-- Left: Dynamic Breadcrumbs -->
    <div class="breadcrumb-container">
    <span class="breadcrumb-section">{{ breadcrumb().section }}</span>
    <span class="breadcrumb-separator">
        <svg lucideChevronRight class="w-3.5 h-3.5"></svg>
    </span>
    <span class="breadcrumb-page">{{ breadcrumb().page }}</span>
    </div>
  
  <!-- Right: Actions & User Profile -->
  <div class="navbar-actions">
    
    <!-- Settings Button (Pengganti Search) -->
    <button type="button" class="action-btn" title="Settings">
      <svg lucideSettings class="w-4 h-4"></svg>
    </button>

    <!-- Notification Button with Red Dot Badge -->
    <button type="button" class="action-btn relative" title="Notifications">
      <svg lucideBell class="w-4 h-4"></svg>
      @if (hasNotification()) {
        <span class="notification-badge"></span>
      }
    </button>

    <!-- Vertical Divider -->
    <div class="divider-v"></div>

    <!-- Staff Profile Card -->
    <div class="profile-card">
      <div class="avatar-box">
        @if (userProfile().avatarUrl) {
          <img [src]="userProfile().avatarUrl" alt="Avatar" class="avatar-img" />
        } @else {
          <svg lucideUser class="w-4 h-4 text-slate-400"></svg>
        }
      </div>

      <div class="profile-info">
        <span class="staff-name">{{ userProfile().name }}</span>
        <span class="staff-role">{{ userProfile().roleTitle }}</span>
      </div>
    </div>

  </div>

</header>
