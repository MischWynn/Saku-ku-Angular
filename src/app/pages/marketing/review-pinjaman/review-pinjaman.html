<div class="relative h-full flex gap-4">
  @if (errorMessage(); as error) {
    <div class="absolute top-2 right-2 z-50 px-4 py-2 rounded-xl bg-red-950/90 border border-red-500/40 text-red-200 text-xs font-medium shadow-lg">
      {{ error }}
    </div>
  }

  <div class="flex-1 min-w-0 flex flex-col gap-4 h-full">

    <app-queue-stats-strip
      [totalCount]="totalCount()"
      [totalAmount]="totalAmount()"
      [avgAmount]="avgAmount()" />

    <div class="flex-1 min-h-0">
      @if (isLoading()) {
        <div class="h-full flex items-center justify-center rounded-3xl bg-slate-900/40 border border-white/8">
          <span class="text-slate-400 text-sm animate-pulse">Memuat antrean...</span>
        </div>
      } @else {
        <app-loan-queue-list
          [title]="title"
          [subtitle]="subtitle"
          [items]="items()"
          [selectedId]="selectedId()"
          (selectItem)="selectItem($event)" />
      }
    </div>

  </div>

  @if (selectedItem(); as selected) {
    <div class="fixed inset-0 z-40 p-4 bg-slate-950/95 backdrop-blur-sm
                sm:static sm:z-auto sm:p-0 sm:bg-transparent sm:backdrop-blur-none
                sm:w-[420px] shrink-0">
      <app-loan-review-drawer
        [item]="selected"
        [role]="role"
        [submitting]="isSubmitting()"
        (close)="closeDrawer()"
        (actionSubmit)="onActionSubmit($event)" />
    </div>
  }
</div>
