<div class="login-page-wrapper">
  
  <!-- Background Glow Elements -->
  <div class="glow-blob-1"></div>
  <div class="glow-blob-2"></div>

  <!-- Shell Card -->
  <div class="login-shell-card">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">

      <!-- Left Hero Banner -->
      <div class="hero-banner-box">
        <img 
          src="assets/Billboards.png" 
          alt="Office Hero" 
          class="hero-bg-img"
        />
        <div class="hero-gradient-overlay"></div>

        <div class="hero-glass-badge">
          <div class="portal-tag">
            <span class="portal-tag-dot"></span>
            Secure Portal
          </div>
          <h3 class="text-base font-bold text-white mb-1 tracking-tight">Welcome to Saku-ku</h3>
          <p class="text-xs text-slate-300 leading-relaxed">
            Secure enterprise access point with end-to-end encrypted protocol.
          </p>
        </div>
      </div>

      <!-- Right Login Card -->
      <div class="login-form-box">
        
        <!-- Brand Header with Logo -->
        <div class="flex items-center gap-3 mb-6">
          <div class="brand-icon-wrapper">
            <span class="brand-logo-mask"></span>
          </div>
          <h2 class="text-xl font-bold text-white tracking-tight">Saku-ku</h2>
        </div>

        <!-- Greeting -->
        <div class="mb-6">
          <h1 class="text-lg font-bold text-white tracking-tight">Selamat datang kembali</h1>
          <p class="text-xs text-slate-400 mt-1">Silakan masuk ke akun administrator Anda</p>
        </div>

        @if (errorMessage()) {
            <div class="alert alert-error text-red-500 text-sm mb-4">
              {{ errorMessage() }}
            </div>
          }

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
          
          <!-- Email Input -->
          <div>
            <label class="form-label-custom">Alamat Email</label>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-500">
                <svg lucideMail class="w-4 h-4"></svg>
              </span>
              <input 
                type="email" 
                formControlName="email"
                placeholder="nama@email.com" 
                class="input-field-custom"
              />
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="form-label-custom">Kata Sandi</label>
              <a routerLink="/forgot-password" class="text-[11px] font-semibold text-[#6EE7B7] hover:underline transition">Lupa sandi?</a>
            </div>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-500">
                <svg lucideLock class="w-4 h-4"></svg>
              </span>
              <input 
                [type]="showPassword() ? 'text' : 'password'" 
                formControlName="password"
                placeholder="••••••••" 
                class="input-field-custom !pr-10"
              />
              <button 
                type="button" 
                (click)="togglePassword()" 
                class="absolute right-3 text-slate-400 hover:text-[#6EE7B7] focus:outline-none transition cursor-pointer"
              >
                @if (showPassword()) {
                  <svg lucideEyeOff class="w-4 h-4"></svg>
                } @else {
                  <svg lucideEye class="w-4 h-4"></svg>
                }
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            [disabled]="loginForm.invalid"
            class="btn-login-submit"
          >
            <span>Masuk Sekarang</span>
            <svg lucideArrowRight class="w-4 h-4"></svg>
          </button>

          <!-- Back to Home Link -->
          <div class="text-center pt-2">
            <p class="text-xs text-slate-400">
              Bukan admin? 
              <a routerLink="/" class="text-[#6EE7B7] font-semibold hover:underline ml-1">Kembali ke Beranda</a>
            </p>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
