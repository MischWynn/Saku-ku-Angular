<div class="space-y-6">

  <div>
    <h1 class="text-2xl font-bold text-white tracking-tight">Riwayat Review Saya</h1>
    <p class="text-sm text-slate-400 mt-1">Semua review pengajuan yang udah kamu lakukan, terbaru di atas.</p>
  </div>

  <div class="p-6 rounded-3xl bg-emerald-900/30 backdrop-blur-xl border border-emerald-500/20">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-base font-bold text-white">Riwayat</h3>
      @if (!isLoading()) {
        <span class="text-xs text-slate-400">{{ history().length }} riwayat ditemukan</span>
      }
    </div>

    @if (isLoading()) {
      <p class="text-sm text-slate-400">Memuat riwayat...</p>
    } @else {
      <app-activity-feed
        [activities]="history()"
        emptyMessage="Kamu belum pernah melakukan review pengajuan." />
    }
  </div>

</div>
