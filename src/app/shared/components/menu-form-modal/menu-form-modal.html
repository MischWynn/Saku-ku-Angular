<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" (click)="close.emit()">
  <div
    class="w-full max-w-md rounded-3xl bg-slate-900/95 backdrop-blur-xl border border-white/10 shadow-2xl p-6 max-h-[90vh] overflow-y-auto"
    (click)="$event.stopPropagation()">

    <div class="flex items-center justify-between mb-5">
      <h2 class="text-lg font-bold text-white">{{ title() }}</h2>
      <button
        type="button"
        (click)="close.emit()"
        class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-colors">
        <svg lucideX class="w-4 h-4"></svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Nama Menu</label>
        <input
          type="text"
          formControlName="namaMenu"
          placeholder="mis. Master Nasabah"
          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/60 border border-white/10 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-emerald-400/50" />
        @if (form.controls.namaMenu.invalid && form.controls.namaMenu.touched) {
          <p class="text-[11px] text-red-400 mt-1">Nama menu wajib diisi.</p>
        }
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Path</label>
        <input
          type="text"
          formControlName="path"
          placeholder="/admin/nasabah"
          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/60 border border-white/10 text-sm text-slate-100 placeholder:text-slate-500 font-mono focus:outline-none focus:border-emerald-400/50" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Icon (nama lucide-angular)</label>
        <input
          type="text"
          formControlName="icon"
          placeholder="mis. LucideUsers"
          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/60 border border-white/10 text-sm text-slate-100 placeholder:text-slate-500 font-mono focus:outline-none focus:border-emerald-400/50" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Parent Menu</label>
          <select
            formControlName="parentId"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/60 border border-white/10 text-sm text-slate-100 focus:outline-none focus:border-emerald-400/50">
            <option value="">Tidak ada (top-level)</option>
            @for (m of parentOptions(); track m.id) {
              <option [value]="m.id">{{ m.namaMenu }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Urutan</label>
          <input
            type="number"
            formControlName="urutan"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/60 border border-white/10 text-sm text-slate-100 focus:outline-none focus:border-emerald-400/50" />
        </div>
      </div>

      @if (isEditMode()) {
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Status</label>
          <select
            formControlName="status"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/60 border border-white/10 text-sm text-slate-100 focus:outline-none focus:border-emerald-400/50">
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>
      }

      @if (errorMessage(); as error) {
        <p class="text-xs text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl px-3.5 py-2.5">{{ error }}</p>
      }

      <div class="flex items-center justify-end gap-3 pt-2">
        <button
          type="button"
          (click)="close.emit()"
          class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:bg-white/5 transition-colors">
          Batal
        </button>
        <button
          type="submit"
          [disabled]="submitting()"
          class="px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-500 text-slate-950 hover:bg-emerald-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          {{ submitting() ? 'Menyimpan...' : (isEditMode() ? 'Simpan Perubahan' : 'Tambah Menu') }}
        </button>
      </div>

    </form>
  </div>
</div>
